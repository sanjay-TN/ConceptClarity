services:
  postgres:
    image: postgres:16-alpine
    container_name: concept-clarity-postgres
    environment:
      POSTGRES_DB: concept_clarity
      POSTGRES_USER: concept_clarity
      POSTGRES_PASSWORD: concept_clarity
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concept_clarity -d concept_clarity"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concept-clarity-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/concept_clarity
      DB_USERNAME: concept_clarity
      DB_PASSWORD: concept_clarity
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000,http://127.0.0.1:5500,null
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
    ports:
      - "18080:8080"

volumes:
  postgres-data:
