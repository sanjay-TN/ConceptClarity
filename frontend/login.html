<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ConceptClarity</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="index.html">
                <img src="assets/brand-mark.svg" alt="ConceptClarity logo">
                <span>ConceptClarity</span>
            </a>
            <nav class="nav-actions" aria-label="Main navigation">
                <a class="nav-link" href="register.html">Register</a>
                <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">Light</button>
            </nav>
        </header>

        <main class="auth-wrap">
            <section class="auth-card">
                <p class="eyebrow">Sign in</p>
                <h1>Welcome back</h1>
                <p class="auth-copy">Log in to generate explanations, save history, and manage favorites.</p>
                <form class="form-stack" data-login-form>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="primary-btn" type="submit">Login</button>
                </form>
                <p class="auth-footer">New here? <a href="register.html">Create an account</a></p>
            </section>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
