<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ConceptClarity</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="index.html">
                <img src="assets/brand-mark.svg" alt="ConceptClarity logo">
                <span>ConceptClarity</span>
            </a>
            <nav class="nav-actions" aria-label="Main navigation">
                <a class="nav-link" href="login.html">Login</a>
                <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">Light</button>
            </nav>
        </header>

        <main class="auth-wrap">
            <section class="auth-card">
                <p class="eyebrow">Join</p>
                <h1>Create account</h1>
                <p class="auth-copy">Build a searchable learning history for every concept you explore.</p>
                <form class="form-stack" data-register-form>
                    <div class="field">
                        <label for="name">Full name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required minlength="2">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
                    </div>
                    <button class="primary-btn" type="submit">Register</button>
                </form>
                <p class="auth-footer">Already registered? <a href="login.html">Login</a></p>
            </section>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
